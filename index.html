<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airtap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage" id="stage" data-mode="plain">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="handOverlay"></canvas>
  <canvas id="gameCanvas"></canvas>
</div>

<div class="ambient">
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <div class="ring r4"></div>
</div>

<div class="mode-switch" id="viewToggle">
  <button data-mode="overlay">Camera</button>
  <span class="sep">/</span>
  <button class="active" data-mode="plain">Background</button>
</div>

<div class="debug-hud" id="debugHud">tracking: <b id="hudStatus">idle</b> · pinch: <b id="hudPinch">off</b></div>

<div class="hero">
  <h1 class="title">AIRTAP</h1>
  <p class="tagline">gesture rhythm · pinch to the beat</p>
  <button class="start-circle" id="startBtn"><span>START</span></button>
  <p class="footnote">runs locally · no video uploaded</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airtap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d0710;
    --panel: #150c1a;
    --pink: #ff3f8e;
    --cyan: #37e2ff;
    --gold: #ffd23f;
    --miss: #ff5252;
    --paper: #f5eef2;
    --paper-dim: #9c8ba3;
    --display: 'Bungee', sans-serif;
    --body: 'Space Grotesk', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; min-height:100vh;
    background: var(--bg); color: var(--paper);
    font-family: var(--body);
    display:flex; flex-direction:column; align-items:center;
    padding: 24px 16px 40px;
  }
  .wrap{ width:100%; max-width: 1100px; }

  header{ text-align:center; margin-bottom: 22px; }
  .eyebrow{
    font-size: 11px; letter-spacing: 0.24em; text-transform:uppercase;
    color: var(--cyan); margin: 0 0 8px;
  }
  h1{
    font-family: var(--display); font-size: clamp(32px, 6vw, 54px);
    margin:0; color: var(--pink);
    text-shadow: 0 0 22px rgba(255,63,142,0.45);
  }
  .sub{ color: var(--paper-dim); font-size: 13px; margin-top: 8px; }

  main{
    display:grid;
    grid-template-columns: minmax(0,0.8fr) minmax(0,1.2fr);
    gap: 16px;
  }
  @media (max-width: 820px){ main{ grid-template-columns: 1fr; } }

  .panel{
    background: var(--panel);
    border: 1px solid rgba(255,63,142,0.25);
    position: relative;
    overflow: hidden;
  }
  .panel-label{
    position:absolute; top:10px; left:12px;
    font-size: 10.5px; letter-spacing: 0.18em; text-transform:uppercase;
    color: var(--cyan); z-index: 2;
  }

  #webcamPanel{ aspect-ratio: 3/4; }
  #gamePanel{ aspect-ratio: 4/3; }

  video, canvas{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit: cover;
  }
  #video{ transform: scaleX(-1); }

  .placeholder{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color: var(--paper-dim); font-size: 12px; text-align:center; padding: 20px;
  }

  .controls{
    display:flex; justify-content:center; margin-top: 18px;
  }
  button#startBtn{
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.1em;
    text-transform: uppercase; font-weight: 600;
    background: var(--pink); color: var(--bg);
    border: none; padding: 13px 26px; cursor: pointer;
  }
  button#startBtn:hover{ background: #ff5fa0; }
  button#startBtn:focus-visible{ outline: 2px solid var(--cyan); outline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Gesture Rhythm Game</p>
    <h1>AIRTAP</h1>
    <p class="sub">osu-style hit circles, played with a pinch instead of a mouse click</p>
  </header>

  <main>
    <div class="panel" id="webcamPanel">
      <span class="panel-label">Tracking Feed</span>
      <video id="video" autoplay playsinline muted></video>
      <canvas id="handOverlay"></canvas>
      <div class="placeholder" id="webcamPlaceholder">camera off — press start</div>
    </div>

    <div class="panel" id="gamePanel">
      <span class="panel-label">Playfield</span>
      <canvas id="gameCanvas"></canvas>
      <div class="placeholder" id="gamePlaceholder">hit circles will appear here</div>
    </div>
  </main>

  <div class="controls">
    <button id="startBtn">Start</button>
  </div>
</div>

<script>
  // step 1: just confirm the button is wired up.
  // step 2 will replace this with real camera + MediaPipe init.
  document.getElementById('startBtn').addEventListener('click', () => {
    console.log('start pressed — camera + tracking come next');
  });
</script>
</body>
</html>
